<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <!-- Tile Gradients -->
    <linearGradient id="tileBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8cf99"/>
      <stop offset="50%" stop-color="#b89358"/>
      <stop offset="100%" stop-color="#735227"/>
    </linearGradient>
    <linearGradient id="tileGrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a6db65"/>
      <stop offset="55%" stop-color="#77ba45"/>
      <stop offset="100%" stop-color="#457f30"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6cd5f7"/>
      <stop offset="50%" stop-color="#2897d4"/>
      <stop offset="100%" stop-color="#16629e"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9be87"/>
      <stop offset="50%" stop-color="#edd8aa"/>
      <stop offset="100%" stop-color="#c9ab71"/>
    </linearGradient>
    <linearGradient id="goldBanner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2ad"/>
      <stop offset="45%" stop-color="#f5c04e"/>
      <stop offset="100%" stop-color="#b87814"/>
    </linearGradient>
    <radialGradient id="treeGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#a8e16d"/>
      <stop offset="55%" stop-color="#55a33f"/>
      <stop offset="100%" stop-color="#226929"/>
    </radialGradient>
    <linearGradient id="tileSide" x2="0" y2="1">
      <stop stop-color="#76532b"/>
      <stop offset="100%" stop-color="#3c2717"/>
    </linearGradient>
    <linearGradient id="badgeEnamel" x2="0" y2="1">
      <stop stop-color="#b63629"/>
      <stop offset="48%" stop-color="#971f24"/>
      <stop offset="100%" stop-color="#69181d"/>
    </linearGradient>
    <linearGradient id="stone" x2="1" y2="1">
      <stop stop-color="#e8d6a6"/>
      <stop offset="100%" stop-color="#aa8354"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="22" y="22" width="64" height="64" rx="14"/>
    </clipPath>
  </defs>

  <!-- 3D Tile Container -->
  <g filter="url(#tileShadow)">
    <!-- Tile 3D Depth Bottom Edge -->
    <rect x="20.5" y="24" width="67" height="67" rx="15" fill="url(#tileSide)"/>
    <path d="M27 86.5q3.8 2.6 9 2.6h35.5q5.5 0 9-2.7" fill="none" stroke="#bb9558" stroke-opacity=".48" stroke-width=".85"/>
    <!-- Tile Beveled Outer Frame -->
    <rect x="20.5" y="20.5" width="67" height="67" rx="15" fill="url(#tileBorder)" stroke="#3d270e" stroke-width="0.8"/>
    <!-- Tile Inner Inset Border -->
    <rect x="22" y="22" width="64" height="64" rx="14" fill="#2d4218"/>

    <!-- Tile Landscape (Clipped) -->
    <g clip-path="url(#tileClip)">
      <!-- Lush Meadow Base -->
      <rect x="22" y="22" width="64" height="64" fill="url(#tileGrass)"/>

      <!-- Layers of hillside and scattered vegetation -->
      <path d="M57 21q9 2 13 8t18 7v-15z" fill="#c5e88a" opacity=".38"/>
      <path d="M56 23q8 2 12 8t19 8M56 27q6 1 10 7t19 8" fill="none" stroke="#dff5aa" stroke-opacity=".43" stroke-width=".7"/>
      <path d="M20 71q12 1 22-6t24 0q8 5 21 3v18H20z" fill="#3b7839" opacity=".24"/>
      <path d="M27 54l1.1 1.4m1.7-2.2-.4 1.4m37.6-28 1 1.2m11.8 4.3.7 1.4m-5.9 39 1.2 1.4m1.1-3.2-.3 2.4m3.8 1.3.9-1.6m-38.5-3.1 1.2 1.6m1.8-2.1-.3 2.4" fill="none" stroke="#d9ed93" stroke-opacity=".83" stroke-width=".6" stroke-linecap="round"/>
      <g fill="#fff1b6">
        <circle cx="62" cy="29" r=".6"/><circle cx="80.5" cy="34" r=".65"/>
        <circle cx="79" cy="72" r=".7"/><circle cx="40.5" cy="77" r=".6"/>
      </g>

      <!-- Winding Sapphire River -->
      <path d="M 18 58 Q 38 72 54 52 T 90 62" fill="none" stroke="rgba(20,50,20,0.3)" stroke-width="14"/>
      <path d="M 18 58 Q 38 72 54 52 T 90 62" fill="none" stroke="#a2e2f7" stroke-width="11"/>
      <path d="M 18 58 Q 38 72 54 52 T 90 62" fill="none" stroke="url(#riverGrad)" stroke-width="8.5"/>
      <path d="M20 58q7 4 13 4.7m-9.7-1.3 2.8 1.4M79 49q4.5 3.2 9 9m-6.4-4.3 2.1 2" fill="none" stroke="#d6f8ff" stroke-opacity=".75" stroke-width=".9" stroke-linecap="round"/>

      <!-- Golden Road -->
      <path d="M 52 18 Q 50 36 62 48 T 58 90" fill="none" stroke="rgba(40,30,10,0.35)" stroke-width="9"/>
      <path d="M 52 18 Q 50 36 62 48 T 58 90" fill="none" stroke="#7a582c" stroke-width="7"/>
      <path d="M 52 18 Q 50 36 62 48 T 58 90" fill="none" stroke="url(#roadGrad)" stroke-width="5"/>
      <path d="M 52 18 Q 50 36 62 48 T 58 90" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.9" stroke-dasharray="3 4"/>

      <!-- Stone Bridge over River -->
      <g transform="translate(50, 48)">
        <rect x="-3" y="-5" width="10" height="10" rx="2" fill="#695c4e" stroke="#3b3228" stroke-width="0.8"/>
        <rect x="-1.5" y="-3.5" width="7" height="7" rx="1.2" fill="#d4c5a9"/>
        <line x1="-3" y1="0" x2="7" y2="0" stroke="#8c7e6c" stroke-width="0.6"/>
      </g>

      <!-- Medieval Castle Fortress (Top Left) -->
      <g transform="translate(22, 22)">
        <path d="M0 0h26Q26 18 0 25z" fill="url(#stone)" stroke="#694929" stroke-width="1.35"/>
        <path d="M1 13h17M0 17h12m-7-4v4m6-7v3M1 21h5" fill="none" stroke="#93693f" stroke-opacity=".72" stroke-width=".65"/>
        <path d="M2.5 4.2h6v2.9h-6zm8-.9h5v2.9h-5zm-5 5.9h6.2v2.5H5.5zm8.2-1.1h4.8v2.5h-4.8z" fill="#b9583c"/>
        <path d="M4 21v-3.5q1.5-2.7 3 0v2.3" fill="#745039"/>
        <path d="M18.7 6q4.7 2.4 8.5-.3v5.4q-4.5 2.3-8.5 0z" fill="url(#stone)" stroke="#765132" stroke-width=".75"/>
        <path d="M22.3 10V8.6q.8-1.1 1.6 0v1.5z" fill="#563826"/>
        <path d="M17.9 6.4 23-2l5.3 8.3q-4.8 2.3-10.4.1z" fill="#bf4f35" stroke="#7c2a20" stroke-width=".75"/>
        <path d="m23 0-1.2 6.9m-3-1.4q4.1 1.6 8.4.1" fill="none" stroke="#ed9770" stroke-opacity=".8" stroke-width=".6"/>
      </g>

      <!-- Little Cottage (Bottom Left) -->
      <g transform="translate(26, 68)">
        <rect x="0" y="3" width="9" height="7" rx="0.6" fill="#f0e2c8" stroke="#6e5130" stroke-width="0.7"/>
        <polygon points="-1,3 4.5,-2 10,3" fill="#c4553a" stroke="#6b1e10" stroke-width="0.7"/>
        <path d="M1 5.5h1.5v1.55H1zm5.7 0h1.35v1.55H6.7z" fill="#8e6841"/>
        <rect x="3.2" y="5.5" width="2.5" height="4.5" fill="#5a3d1c"/>
      </g>

      <!-- Trees -->
      <g transform="translate(73, 33)">
        <ellipse cx="1" cy="4" rx="4.5" ry="2" fill="rgba(15,45,15,0.3)"/>
        <circle cx="0" cy="0" r="4.5" fill="url(#treeGrad)" stroke="#1a5420" stroke-width="0.7"/>
        <path d="M-2.8-1.2a3.1 3.1 0 0 1 3.4-1.9" fill="none" stroke="#d9f7a4" stroke-opacity=".7" stroke-width=".65" stroke-linecap="round"/>
        <circle cx="1.7" cy="1.5" r=".85" fill="#387d32" opacity=".7"/>
      </g>
      <g transform="translate(77, 41)">
        <ellipse cx="1" cy="3.5" rx="3.8" ry="1.8" fill="rgba(15,45,15,0.3)"/>
        <circle cx="0" cy="0" r="3.8" fill="url(#treeGrad)" stroke="#1a5420" stroke-width="0.7"/>
        <circle cx="-1" cy="-1.2" r="1.2" fill="rgba(215,255,170,0.5)"/>
      </g>
      <g transform="translate(68, 72)">
        <ellipse cx="1" cy="3.5" rx="4" ry="1.8" fill="rgba(15,45,15,0.3)"/>
        <circle cx="0" cy="0" r="4" fill="url(#treeGrad)" stroke="#1a5420" stroke-width="0.7"/>
      </g>

      <!-- Light gloss overlay on tile -->
      <path d="M 22 22 L 86 22 L 22 86 Z" fill="rgba(255,255,255,0.09)"/>
    </g>

    <!-- Inner Golden Edge Highlight -->
    <rect x="22.5" y="22.5" width="63" height="63" rx="13.5" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" pointer-events="none"/>
  </g>

  <!-- Central badge and monogram -->
  <g filter="url(#badgeShadow)">
    <!-- Slanted Trapezoid Tile Emblem Plate -->
    <g transform="translate(54, 52) scale(1.02)">
      <!-- Badge Base -->
      <rect x="-24" y="-14" width="48" height="28" rx="7" transform="skewX(-10)" fill="#11182c" stroke="#3b4d7c" stroke-width="1.2"/>
      <!-- Gold Inner Border -->
      <rect x="-22" y="-12.5" width="44" height="25" rx="5.5" transform="skewX(-10)" fill="url(#goldBanner)" stroke="#fff" stroke-width="0.7"/>

      <!-- Red Regal Ribbon Inset -->
      <rect x="-20" y="-10.5" width="40" height="21" rx="4.5" transform="skewX(-10)" fill="url(#badgeEnamel)" stroke="#520e0e" stroke-width="0.8"/>
      <path d="M-16-8.2h31" transform="skewX(-10)" stroke="#f89870" stroke-opacity=".46" stroke-width=".7" stroke-linecap="round"/>
      
      <g text-anchor="middle" font-family="'Unbounded', 'Arial Black', sans-serif" font-weight="900" font-size="17" letter-spacing="-0.5px">
        <text y="7" fill="#3b0a0a">Tt</text>
        <text y="6" fill="url(#goldBanner)">Tt</text>
      </g>
    </g>
  </g>

  <!-- Horizontal wordmark at the foot of the tile -->
  <g transform="translate(54, 78.5)">
    <rect x="-24" y="-4.9" width="48" height="9.8" rx="2.1" fill="#152239" stroke="#d7b978" stroke-width="0.85"/>
    <text y="2.1" text-anchor="middle" font-family="'Onest', sans-serif" font-weight="700" font-size="5.9" fill="#fff6dc" letter-spacing="0.9px">TILETOPIA</text>
  </g>
</svg>
