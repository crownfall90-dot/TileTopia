<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="c-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <!-- Outer edge 3D thickness -->
    <linearGradient id="c-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a3418"/>
      <stop offset="100%" stop-color="#3d1408"/>
    </linearGradient>
    <!-- Face bevel gradient -->
    <linearGradient id="c-rim" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#ffb188"/>
      <stop offset="40%" stop-color="#d46132"/>
      <stop offset="100%" stop-color="#5a1e0c"/>
    </linearGradient>
    <!-- Inner field recessed gradient -->
    <radialGradient id="c-field" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#e87742"/>
      <stop offset="55%" stop-color="#b64920"/>
      <stop offset="100%" stop-color="#641f0b"/>
    </radialGradient>
    <!-- Emboss highlight/shadow -->
    <linearGradient id="c-emboss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd5be"/>
      <stop offset="100%" stop-color="#4a1507"/>
    </linearGradient>
    <linearGradient id="c-glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- 3D Coin Edge / Base -->
  <g filter="url(#c-shadow)">
    <!-- Bottom 3D thickness lip -->
    <ellipse cx="32" cy="34" rx="27" ry="27" fill="url(#c-edge)"/>
    <!-- Main coin face -->
    <circle cx="32" cy="31" r="27" fill="url(#c-rim)"/>
    <!-- Outer rim inner shadow -->
    <circle cx="32" cy="31" r="24.5" fill="#521909"/>
    <!-- Recessed coin field -->
    <circle cx="32" cy="31" r="23" fill="url(#c-field)"/>
    <!-- Beaded / dashed milled ring -->
    <circle cx="32" cy="31" r="21" fill="none" stroke="#ffa375" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.65"/>
    
    <!-- EMBOSSED SYMBOL: Medieval Castle Tower with Meeple Arch -->
    <!-- Shadow underneath emboss -->
    <path d="M22 41h20v-3l-2-2v-9h2v-4h-4v2h-4v-2h-4v2h-4v-2h-4v4h2v9l-2 2v3zm7-4c0-1.7 1.3-3 3-3s3 1.3 3 3v4h-6v-4z" fill="#380f05" transform="translate(0, 1.2)"/>
    <!-- Highlighted emboss body -->
    <path d="M22 40h20v-3l-2-2v-9h2v-4h-4v2h-4v-2h-4v2h-4v-2h-4v4h2v9l-2 2v3zm7-4c0-1.7 1.3-3 3-3s3 1.3 3 3v4h-6v-4z" fill="url(#c-emboss)"/>
    <!-- Top inner highlight line on tower -->
    <path d="M23 23h18v1.5h-18zm2 6h14v1h-14z" fill="#ffe0ce" opacity="0.8"/>
    
    <!-- Diagonal metallic coin sheen -->
    <path d="M12 25 Q 32 10 46 14 A 23 23 0 0 0 16 16 Z" fill="url(#c-glare)"/>
  </g>
</svg>