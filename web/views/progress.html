      <section class="screen scroll scr-road-fullscreen" id="scr-progress" hidden>
        <!-- Floating HUD: Back button & Quests button (SVG icons, no standard emojis) -->
        <div class="road-floating-hud">
          <button class="road-float-btn road-back-btn" data-go="menu" aria-label="Назад в меню">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
            <span>Назад</span>
          </button>
          <button class="road-float-btn road-quests-btn" id="btnRoadQuests" aria-label="Задания">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/></svg>
            <span>Задания</span>
            <i class="road-dot" id="roadQuestsDot" hidden></i>
          </button>
        </div>

        <!-- Fullscreen Road Container -->
        <div class="road-fullscreen-wrap">
          <div class="col" id="ptab"></div>
        </div>

        <!-- Quests Slide-over Sheet (opens on tapping "Задания") -->
        <div id="roadQuestsSheet" class="road-quests-sheet" hidden>
          <div class="road-sheet-card">
            <div class="road-sheet-header">
              <button class="road-float-btn sm" id="btnCloseRoadQuests" aria-label="К дороге">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
                <span>К дороге</span>
              </button>
              <h3>Задания</h3>
            </div>
            <div class="road-sheet-body" id="roadQuestsSheetBody"></div>
          </div>
        </div>
      </section>
