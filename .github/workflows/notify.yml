name: Send update push

# Run by hand: after a version goes live on Google Play (its review takes a while, so this is
# not tied to the GitHub release), or to repeat a push for GitHub-build players.
on:
  workflow_dispatch:
    inputs:
      store:
        description: Which players to notify
        type: choice
        options: [play, github]
        default: play
      code:
        description: Version code that is now available (e.g. 107)
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          STORE: ${{ inputs.store }}
          CODE: ${{ inputs.code }}
        run: |
          # inputs go through env vars, never into the script text
          case "$CODE" in ''|*[!0-9]*) echo "code must be digits only" >&2; exit 1;; esac
          python3 scripts/fcm-send.py "updates-$STORE" "$CODE" "1.0.$CODE" release-notes.md
