name: Android compile check

# Compiles the Java of all flavours (staging, github and play) on each push that touches the app, so a Java mistake is caught before a release
# (the full signed build only runs at release time). No signing, no publishing.
on:
  push:
    paths: ['app/**', '.github/workflows/android-compile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile all flavours
        run: |
          chmod +x gradlew
          ./gradlew compileStagingReleaseJavaWithJavac compileGithubReleaseJavaWithJavac compilePlayReleaseJavaWithJavac --no-daemon
