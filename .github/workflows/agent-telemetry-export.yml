name: Player usage report

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usage-report
  cancel-in-progress: false

jobs:
  usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read opt-in usage
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: https://puzzlegrad-default-rtdb.europe-west1.firebasedatabase.app
        run: python3 scripts/export-usage.py

      - name: Publish aggregate report
        run: |
          git config user.name 'Tiletopia Agent Bot'
          git config user.email 'bot@tiletopia.app'
          cp -r build/usage-report "$RUNNER_TEMP/tiletopia-usage-report"
          if git fetch origin refs/heads/telemetry/agent-hub; then
            git switch -c telemetry/agent-hub FETCH_HEAD
          else
            git switch --orphan telemetry/agent-hub
          fi
          git rm --ignore-unmatch -- agent_data/ERRORS.md agent_data/FEEDBACK.md agent_data/agent_telemetry.json
          mkdir -p agent_data
          cp "$RUNNER_TEMP"/tiletopia-usage-report/{ANALYTICS.md,usage.json} agent_data/
          git add -- agent_data/ANALYTICS.md agent_data/usage.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(analytics): publish aggregated usage [skip ci]'
            git push origin HEAD:telemetry/agent-hub
          fi
