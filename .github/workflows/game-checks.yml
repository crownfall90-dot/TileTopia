name: Game regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'app/src/main/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'vite.config.js'
      - '.github/workflows/game-checks.yml'

permissions:
  contents: read

concurrency:
  group: game-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
