name: Test APK (Tiletopia Test)

on:
  push:
    branches: [setup/test-environment, dev, 'dev/**', test, 'test/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      custom_code:
        description: 'Принудительный versionCode (оставьте пустым для авто: боевая + 1)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/setup/test-environment' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/dev/') || startsWith(github.ref, 'refs/heads/test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.verify.outputs.status }}
      expected: ${{ steps.verify.outputs.expected }}
      actual: ${{ steps.verify.outputs.actual }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare signing key
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE || secrets.BACKUP_PASSPHRASE }}
        run: if [ -f scripts/ci/signing-key.sh ]; then bash scripts/ci/signing-key.sh; fi
      - name: Compute next version code
        id: ver
        run: |
          if [ -n "${{ inputs.custom_code }}" ]; then
            CODE="${{ inputs.custom_code }}"
          else
            # Test APK always gets the next version after the latest production release tag (vNNN).
            REMOTE_LAST=$(git ls-remote --tags origin 'v*' 2>/dev/null | sed -n 's#.*refs/tags/v\([0-9][0-9]*\)$#\1#p' | sort -n | tail -1)
            LOCAL_LAST=$(git tag -l 'v*' 2>/dev/null | sed -n 's#^v\([0-9][0-9]*\)$#\1#p' | sort -n | tail -1)
            LAST="${REMOTE_LAST:-$LOCAL_LAST}"
            CODE=$(( ${LAST:-260} + 1 ))
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version=1.0.${CODE}-test" >> "$GITHUB_OUTPUT"
          echo "::notice::Test APK version: 1.0.${CODE}-test (production latest: v${LAST:-260})"
      - name: Build test APK (staging flavor)
        env:
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          sh scripts/wrap-web.sh
          chmod +x gradlew
          # staging flavor → applicationId 'app.crownfall.tiletopia.test' (completely isolated from production)
          ./gradlew assembleStagingRelease -PversionCode=${{ steps.ver.outputs.code }} --no-daemon
      - name: Verify APK isolation and signing
        id: verify
        run: python3 scripts/verify-staging.py
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/staging/release/app-staging-release.apk \
             "Tiletopia-Test-${{ steps.ver.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Tiletopia-Test-${{ steps.ver.outputs.version }}
          path: |
            Tiletopia-Test-${{ steps.ver.outputs.version }}.apk
            TEST-BUILD.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish test pre-release for testers
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete staging-latest --yes || true
          gh release create staging-latest \
            "Tiletopia-Test-${{ steps.ver.outputs.version }}.apk" \
            --title "Tiletopia Test (${{ steps.ver.outputs.version }})" \
            --notes "Тестовая сборка (отдельное приложение «Tiletopia Test»). Устанавливается рядом с боевой версией, не заменяет её. Пакет: app.crownfall.tiletopia.test. Версия: ${{ steps.ver.outputs.version }}" \
            --prerelease
      - name: Upload public diagnostics even on verification failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Staging-diagnostics-${{ steps.ver.outputs.code }}-${{ github.run_attempt }}
          path: SIGNING-DIAGNOSTICS.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          if [ -n "${STAGING_KEYSTORE_FILE:-}" ]; then rm -f -- "$STAGING_KEYSTORE_FILE"; fi
